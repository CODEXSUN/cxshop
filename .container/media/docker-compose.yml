name: cxshop-media

services:
  media:
    build:
      context: ../..
      dockerfile: .container/media/Dockerfile
      args:
        CXSHOP_VERSION: ${CXSHOP_VERSION:?CXSHOP_VERSION is required}
        FILEBROWSER_BASE_IMAGE: ${FILEBROWSER_BASE_IMAGE:?FILEBROWSER_BASE_IMAGE is required}
    image: ${CXSHOP_IMAGE_REGISTRY:?CXSHOP_IMAGE_REGISTRY is required}/media:${MEDIA_IMAGE_TAG:?MEDIA_IMAGE_TAG is required}
    container_name: cxshop-media
    restart: unless-stopped
    user: "0:0"
    command:
      - --address
      - 0.0.0.0
      - --port
      - "80"
      - --root
      - /srv
      - --database
      - /database/filebrowser.db
    ports:
      - "${CXSHOP_BIND_ADDRESS:?CXSHOP_BIND_ADDRESS is required}:${MEDIA_HOST_PORT:?MEDIA_HOST_PORT is required}:80"
    labels:
      traefik.enable: "true"
      traefik.http.routers.cxshop-media.rule: "Host(`${CXSHOP_MEDIA_HOST:?CXSHOP_MEDIA_HOST is required}`)"
      traefik.http.routers.cxshop-media.entrypoints: websecure
      traefik.http.routers.cxshop-media.tls: "true"
      traefik.http.routers.cxshop-media.tls.certresolver: letsencrypt
      traefik.http.services.cxshop-media.loadbalancer.server.port: "80"
    volumes:
      - media-data:/srv
      - media-db:/database
    networks:
      - cxshop-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

volumes:
  media-data:
    name: ${MEDIA_DATA_VOLUME:?MEDIA_DATA_VOLUME is required}
    external: true
  media-db:
    name: ${MEDIA_DB_VOLUME:?MEDIA_DB_VOLUME is required}
    external: true

networks:
  cxshop-network:
    name: ${CXSHOP_DOCKER_NETWORK:?CXSHOP_DOCKER_NETWORK is required}
    external: true
